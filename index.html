<html lang="es">
<head>

  <title>HEXA-DATA CLOUD | Enterprise Architecture</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300B4D8'/%3E%3Cstop offset='1' stop-color='%230077b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-weight='900' font-size='13' fill='%23ffffff'%3EHX%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #030d1a;
      --surface: rgba(7, 25, 55, 0.62);
      --line: rgba(0, 180, 216, 0.18);
      --line-bright: rgba(255,255,255,0.10);
      --text: #e8f1fb;
      --muted: #94a9c0;
      --brand: #00B4D8;
      --brand-2: #7bd3ea;
      --ok: #2dd4bf;
      --warn: #f59e0b;
      --danger: #ef4444;
      --mono: "Consolas", "Courier New", monospace;
      --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --radius: 12px;
      --shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      --glass-bg: rgba(7, 25, 55, 0.62);
      --glass-blur: blur(14px);
      --glow-brand: 0 0 18px rgba(0,180,216,0.28);
      --glow-white: 0 0 10px rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #030d1a;
      background-image:
        radial-gradient(ellipse 130% 60% at 80% -5%, rgba(0,70,130,0.50) 0%, transparent 60%),
        radial-gradient(ellipse 70% 40% at 5% 95%, rgba(0,60,120,0.30) 0%, transparent 55%);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    /* Neural canvas */
    #neural-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    header, nav, main, footer { position: relative; z-index: 1; }

    .container {
      width: min(1160px, 92vw);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--line-bright);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 1px 0 rgba(0,180,216,0.15);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, var(--brand), #0077b6);
      color: #fff;
      font-weight: 900;
      font-family: var(--mono);
      box-shadow: 0 0 14px rgba(0,180,216,0.4), inset 0 0 0 1px rgba(255,255,255,0.15);
    }

    .nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: 0.2s ease;
    }

    .nav a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255,255,255,0.03);
    }

    .hero {
      padding: 72px 0 42px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: stretch;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(1.9rem, 4vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 0 0 18px;
      color: var(--muted);
      max-width: 62ch;
    }

    .hero-panel,
    .card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--line-bright);
      border-radius: var(--radius);
      box-shadow: var(--shadow), var(--glow-white);
      transition: box-shadow 0.3s, border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(0,180,216,0.30);
      box-shadow: var(--shadow), var(--glow-brand);
    }

    .hero-panel {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .kpi {
      background: rgba(0,20,50,0.60);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    .kpi-value {
      font-family: var(--mono);
      font-size: 1.25rem;
      color: var(--brand);
      margin-bottom: 4px;
      text-shadow: 0 0 12px rgba(0,180,216,0.5);
    }

    .kpi-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 0;
    }

    .pill {
      font-size: 0.76rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    .section {
      padding: 34px 0;
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 1.55rem;
      letter-spacing: -0.01em;
    }

    .section-intro {
      color: var(--muted);
      margin: 0 0 22px;
      max-width: 80ch;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      padding: 16px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.06rem;
    }

    .card p,
    .card li {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .card ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 6px;
    }

    .repo-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .repo-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      background: rgba(0,20,50,0.55);
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--brand);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .repo-item:hover {
      border-color: rgba(0,180,216,0.35);
      box-shadow: 0 0 14px rgba(0,180,216,0.15);
    }

    .status {
      display: inline-block;
      margin-left: 8px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.68rem;
      border: 1px solid transparent;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status.ok {
      color: var(--ok);
      border-color: rgba(45,212,191,0.4);
      background: rgba(45,212,191,0.1);
    }

    .status.progress {
      color: var(--warn);
      border-color: rgba(245,158,11,0.4);
      background: rgba(245,158,11,0.1);
    }

    .status.plan {
      color: var(--muted);
      border-color: rgba(154,176,200,0.35);
      background: rgba(154,176,200,0.08);
    }

    .layer-stack {
      display: grid;
      gap: 10px;
    }

    .layer {
      border: 1px solid var(--line);
      border-left: 4px solid var(--brand);
      border-radius: 10px;
      padding: 11px 12px;
      background: rgba(0,20,50,0.55);
      box-shadow: -2px 0 12px rgba(0,180,216,0.10);
    }

    .layer strong {
      display: block;
      font-family: var(--mono);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 3px;
      color: var(--brand);
      text-shadow: 0 0 10px rgba(0,180,216,0.4);
    }

    .repo-structure {
      background: #08172c;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      font-family: var(--mono);
      color: #a6c4e3;
      overflow-x: auto;
      white-space: pre;
      font-size: 0.86rem;
    }

    .roadmap {
      display: grid;
      gap: 12px;
    }

    .phase {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      transition: border-color 0.2s;
    }

    .phase:hover {
      border-color: rgba(0,180,216,0.30);
    }

    .phase h4 {
      margin: 0 0 6px;
      font-size: 0.96rem;
    }

    .phase p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .cta {
      padding: 18px;
      border: 1px solid var(--line-bright);
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glow-brand);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      border: 1px solid var(--line-bright);
      color: var(--text);
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s ease;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .btn:hover {
      border-color: var(--brand);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--brand), #0077b6);
      color: #fff;
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 4px 16px rgba(0,180,216,0.35);
    }

    .btn.primary:hover {
      box-shadow: 0 6px 24px rgba(0,180,216,0.55);
    }

    footer {
      padding: 30px 0 42px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      margin-top: 24px;
      font-size: 0.88rem;
    }

    .impact-section {
      border-top: 1px solid var(--line-bright);
      border-bottom: 1px solid var(--line-bright);
      padding: 64px 0;
      background: linear-gradient(180deg, transparent, rgba(0,180,216,0.04) 50%, transparent);
      position: relative;
    }

    .impact-quote {
      border-left: 3px solid var(--brand);
      padding: 16px 22px;
      margin: 0 0 36px;
      color: var(--brand-2);
      font-size: 1.2rem;
      font-style: italic;
      background: rgba(0,180,216,0.06);
      border-radius: 0 var(--radius) var(--radius) 0;
      box-shadow: -3px 0 20px rgba(0,180,216,0.20);
    }

    .impact-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .impact-story {
      color: var(--muted);
      line-height: 1.75;
    }

    .impact-story strong {
      color: var(--text);
    }

    .impact-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .impact-feature {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--line-bright);
      border-radius: var(--radius);
      box-shadow: var(--glow-white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .impact-feature:hover {
      border-color: rgba(0,180,216,0.30);
      box-shadow: var(--glow-brand);
    }

    .impact-feature-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .impact-feature-text strong {
      display: block;
      color: var(--brand);
      font-size: 0.9rem;
      margin-bottom: 2px;
      text-shadow: 0 0 10px rgba(0,180,216,0.35);
    }

    .impact-feature-text span {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .impact-cta {
      margin-top: 28px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .impact-author {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .impact-author strong {
      color: var(--brand);
    }

    .impact-closing-quote {
      margin-top: 28px;
      color: var(--muted);
      font-style: italic;
      font-size: 0.92rem;
    }

    @media (max-width: 1000px) {
      .hero,
      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .impact-body {
        grid-template-columns: 1fr;
      }

      .kpis {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        align-items: flex-start;
        padding: 10px 0;
      }
    }

    .footer-author {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--brand);
      box-shadow: 0 0 14px rgba(0,180,216,0.40), 0 0 0 3px rgba(0,180,216,0.12);
      object-fit: cover;
      object-position: center top;
      flex-shrink: 0;
      transition: box-shadow 0.3s;
    }

    .footer-avatar:hover {
      box-shadow: 0 0 22px rgba(0,180,216,0.65), 0 0 0 3px rgba(0,180,216,0.20);
    }
</head>

  <main>
    <section class="container hero" id="vision">
      <div>
        <h1>HEXA-DATA CLOUD — Ecosistema modular de inteligencia distribuida</h1>
        <p>
          Arquitectura empresarial, gobierno tecnico y escalabilidad progresiva.

          <strong style="color: var(--brand-2);">Mensaje institucional</strong>
          <p style="margin: 8px 0 0; color: var(--muted);">
            HEXA-DATA CLOUD es un ecosistema modular de inteligencia distribuida.
          </p>
        </div>
        <div>
          <strong style="color: var(--brand-2);">Ejecucion recomendada</strong>

      </aside>
    </section>

    <section class="impact-section" id="impact" aria-label="Historia e impacto">

    <section class="section" id="architecture">
      <div class="container">
        <h2>Decision de arquitectura: estrategia hibrida</h2>
        <p class="section-intro">
          Multi-repo como base para independencia por producto, mas un repositorio central para normas
          compartidas, contratos y lineamientos de seguridad.
        </p>

        <div class="grid-2">
          <article class="card">
            <h3>Modelo operativo</h3>
            <ul>
              <li>Multi-repo para velocidad por dominio.</li>
              <li>hexadata-architecture como fuente de verdad tecnica.</li>
              <li>hexadata-api-contracts para versionar interfaces.</li>
              <li>hexadata-sdk para consumo uniforme entre modulos.</li>
            </ul>
          </article>

          <article class="card">
            <h3>Capas del ecosistema</h3>

  <script>
    (function initNeuralCanvas() {
      const canvas = document.getElementById('neural-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let W, H, nodes, raf;

      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }

      function makeNode() {
        return {
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.40, vy: (Math.random() - 0.5) * 0.40,
          r: Math.random() * 2.0 + 1.0, pulse: Math.random() * Math.PI * 2
        };
      }

      function init() {
        const count = Math.min(65, Math.floor((W * H) / 14000));
        nodes = Array.from({ length: count }, makeNode);
      }

      const DIST = 150;

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const t = Date.now() * 0.0008;

        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < DIST) {
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.strokeStyle = 'rgba(0, 140, 180, ' + ((1 - d / DIST) * 0.32) + ')';
              ctx.lineWidth = (1 - d / DIST) * 1.1;
              ctx.stroke();
            }
          }
        }

        nodes.forEach(n => {
          const pulse = (Math.sin(t * 1.5 + n.pulse) + 1) * 0.5;
          const r = n.r + pulse * 1.4;
          const alpha = 0.45 + pulse * 0.45;
          const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 4);
          grd.addColorStop(0, 'rgba(123, 211, 234, ' + (alpha * 0.55) + ')');
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath(); ctx.arc(n.x, n.y, r * 4, 0, Math.PI * 2);
          ctx.fillStyle = grd; ctx.fill();
          ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 180, 216, ' + alpha + ')'; ctx.fill();
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > W) n.vx *= -1;
          if (n.y < 0 || n.y > H) n.vy *= -1;
        });

        raf = requestAnimationFrame(draw);
      }

      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!mq.matches) { resize(); init(); draw(); }
      window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); init(); draw(); });
    })();
  </script>
